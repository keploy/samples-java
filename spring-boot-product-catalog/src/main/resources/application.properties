spring.application.name=product-catalog

# Server
server.port=8080

# Fast cold-start: Tomcat accepts connections in a few seconds (beans init on demand).
# Keeps Keploy's cluster replay pod from racing a slow boot -> no "unreplayable" first tests.
spring.main.lazy-initialization=true

# Datasource — overridable via env vars so the same jar runs locally and in docker-compose.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/catalog}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:catalog}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:catalog}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Actuator — expose a health endpoint for docker-compose healthchecks.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# The "Orders API" on the Gravitee gateway: context path /orders -> orders-api.orders:8080/orders.
# Policy (request flow): Transform Headers adds X-Gateway / X-Api-Plan, strips X-Internal-Debug.
# Gravitee itself adds X-Gravitee-Transaction-Id and X-Gravitee-Request-Id to every backend call.
apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-api-definition
  namespace: gateway
  labels:
    managed-by: gravitee.io
    gio-type: apidefinitions.gravitee.io
data:
  environmentId: DEFAULT
  apiDefinitionVersion: "2.0.0"
  definition: |
    {
      "id": "6f1c2a3b-0000-4000-8000-0000000000a1",
      "name": "Orders API",
      "version": "1.0",
      "gravitee": "2.0.0",
      "flow_mode": "DEFAULT",
      "execution_mode": "v4-emulation-engine",
      "proxy": {
        "virtual_hosts": [ { "path": "/orders" } ],
        "strip_context_path": false,
        "preserve_host": false,
        "groups": [ {
          "name": "orders-backend",
          "endpoints": [ {
            "name": "orders-api",
            "target": "http://orders-api.orders.svc.cluster.local:8080/orders",
            "weight": 1, "backup": false, "type": "http"
          } ],
          "load_balancing": { "type": "ROUND_ROBIN" },
          "http": { "connectTimeout": 5000, "readTimeout": 10000, "keepAlive": false, "pipelining": false, "maxConcurrentConnections": 100, "useCompression": false, "followRedirects": false }
        } ]
      },
      "plans": [ {
        "id": "6f1c2a3b-0000-4000-8000-0000000000b1",
        "name": "Keyless",
        "security": "KEY_LESS",
        "status": "PUBLISHED",
        "api": "6f1c2a3b-0000-4000-8000-0000000000a1",
        "flows": [],
        "paths": {}
      } ],
      "flows": [ {
        "name": "gateway-headers",
        "path-operator": { "path": "/", "operator": "STARTS_WITH" },
        "condition": "",
        "methods": [],
        "enabled": true,
        "pre": [ {
          "name": "Transform Headers",
          "description": "Stamp gateway headers on every request to orders-api",
          "enabled": true,
          "policy": "transform-headers",
          "configuration": {
            "scope": "REQUEST",
            "addHeaders": [
              { "name": "X-Gateway", "value": "gravitee-apim-4.9" },
              { "name": "X-Api-Plan", "value": "keyless" }
            ],
            "removeHeaders": [ "X-Internal-Debug" ]
          }
        } ],
        "post": [ {
          "name": "Transform Headers",
          "description": "Tag responses",
          "enabled": true,
          "policy": "transform-headers",
          "configuration": {
            "scope": "RESPONSE",
            "addHeaders": [ { "name": "X-Served-By", "value": "gravitee" } ]
          }
        } ]
      } ],
      "properties": [],
      "resources": [],
      "path_mappings": {},
      "response_templates": {}
    }

server.port=8080
spring.application.name=orders-api
spring.main.banner-mode=off

# PostgreSQL (order store, plain TCP so Keploy Postgres parser sees wire frames cleanly)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres.data.svc.cluster.local:5432/orders?sslmode=disable&prepareThreshold=0}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:orders}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:orderspass}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=5000

# Redis (read-through cache + POST idempotency SETNX)
redis.host=${REDIS_HOST:redis.data.svc.cluster.local}
redis.port=${REDIS_PORT:6379}

# Internal inventory-api reached OUTBOUND through Gravitee APIM Gateway
inventory.url=${INVENTORY_URL:http://gravitee-gateway.gateway.svc.cluster.local:82/inventory/reserve}
inventory.api-key=${INVENTORY_API_KEY:orders-internal-key-v1}

# Partner payments-api reached OUTBOUND through the ModSecurity / OWASP CRS WAF Ingress
payments.url=${PAYMENTS_URL:http://ingress-nginx-controller.ingress-nginx.svc.cluster.local/payments/authorize}
payments.host-header=${PAYMENTS_HOST_HEADER:payments.partner.local}

# Solace PubSub+ native SMF v3 (TCP 55555)
solace.smf.host=${SOLACE_SMF_HOST:tcp://solace.messaging.svc.cluster.local:55555}
solace.smf.vpn=${SOLACE_SMF_VPN:default}
solace.smf.username=${SOLACE_SMF_USERNAME:default}
solace.smf.password=${SOLACE_SMF_PASSWORD:}
orders.topic=${ORDERS_TOPIC:orders/created}
orders.cancel-topic=${ORDERS_CANCEL_TOPIC:orders/cancelled}
app.version=${APP_VERSION:1.0.0}
